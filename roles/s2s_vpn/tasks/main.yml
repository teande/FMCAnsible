---
- name: Validate S2S VPN mode
  ansible.builtin.assert:
    that:
      - s2s_vpn is defined
      - s2s_vpn is mapping
      - s2s_vpn.mode | default('sdwan') in ['sdwan', 'route_based']
    fail_msg: >-
      Pass one s2s_vpn mapping with mode=sdwan or mode=route_based.

- name: Configure SD-WAN site-to-site VPN
  ansible.builtin.include_tasks: sdwan.yml
  when: s2s_vpn.mode | default('sdwan') == 'sdwan'

- name: Configure manual route-based site-to-site VPN
  ansible.builtin.include_tasks: route_based.yml
  when: s2s_vpn.mode | default('sdwan') == 'route_based'
