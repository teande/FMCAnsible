---
- name: Get deployable devices after SD-WAN change
  cisco.fmcansible.fmc_configuration:
    operation: getDeployableDevice
    path_params:
      domainUUID: "{{ sdwan_domain_uuid }}"
    query_params:
      expanded: true
    register_as: sdwan_deployable_after

- name: Select hub and spoke deployment targets
  ansible.builtin.set_fact:
    sdwan_deployment_targets: >-
      {{ (sdwan_deployable_after | default([]))
         | selectattr('device.id', 'in',
                      [sdwan_resolved_hub.device.id,
                       sdwan_resolved_spoke.device.id]) | list }}

- name: Require deployment targets are ready
  ansible.builtin.assert:
    that:
      - >-
        sdwan_deployment_targets
        | rejectattr('canBeDeployed', 'equalto', true) | list | length == 0
      - >-
        sdwan_deployment_targets
        | selectattr('isDeploying', 'equalto', true) | list | length == 0
    fail_msg: >-
      The hub or spoke has pending changes but cannot currently be deployed.
      Check FMC deployment readiness for both selected devices.

- name: Submit SD-WAN deployment
  cisco.fmcansible.fmc_configuration:
    operation: createDeploymentRequest
    data:
      type: DeploymentRequest
      version: "0"
      forceDeploy: false
      ignoreWarning: false
      deploymentNote: >-
        {{ sdwan_vpn.state | default('present') }} {{ sdwan_vpn.name }}
      deviceList: >-
        {{ sdwan_deployment_targets | map(attribute='device.id') | list }}
    path_params:
      domainUUID: "{{ sdwan_domain_uuid }}"
  register: sdwan_deployment_request
  when: sdwan_deployment_targets | length > 0

- name: Wait for SD-WAN deployment task
  cisco.fmcansible.fmc_configuration:
    operation: getTaskStatus
    path_params:
      domainUUID: "{{ sdwan_domain_uuid }}"
      objectId: "{{ sdwan_deployment_request.response.metadata.task.id }}"
    query_params:
      showDetailedDeviceStatus: true
  register: sdwan_deployment_status
  until: >-
    sdwan_deployment_status.response.status | default('') | upper
    in ['COMPLETED', 'DEPLOYED', 'FAILED']
  retries: 80
  delay: 15
  when: sdwan_deployment_targets | length > 0

- name: Require successful SD-WAN deployment
  ansible.builtin.assert:
    that:
      - >-
        sdwan_deployment_status.response.status | upper
        in ['COMPLETED', 'DEPLOYED']
      - >-
        sdwan_deployment_status.response.subTasks | default([])
        | rejectattr('status', 'equalto', 'SUCCEEDED') | list | length == 0
    fail_msg: >-
      SD-WAN deployment failed: {{ sdwan_deployment_status.response.message
      | default('Check FMC deployment details') }}.
  when: sdwan_deployment_targets | length > 0
