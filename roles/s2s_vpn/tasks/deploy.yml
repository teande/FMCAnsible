---
- name: Get deployable devices after S2S changes
  cisco.fmcansible.fmc_configuration:
    operation: getDeployableDevice
    path_params:
      domainUUID: "{{ s2s_domain_uuid }}"
    query_params:
      expanded: true
    register_as: s2s_deployable_after

- name: Select hub and spoke deployment targets
  ansible.builtin.set_fact:
    s2s_deployment_targets: >-
      {{ (s2s_deployable_after | default([]))
         | selectattr('device.id', 'in',
                      [s2s_hub_device.id, s2s_spoke_device.id]) | list }}

- name: Require deployment targets are ready
  ansible.builtin.assert:
    that:
      - >-
        s2s_deployment_targets
        | rejectattr('canBeDeployed', 'equalto', true) | list | length == 0
      - >-
        s2s_deployment_targets
        | selectattr('isDeploying', 'equalto', true) | list | length == 0
    fail_msg: >-
      The hub or spoke has pending changes but cannot currently be deployed.
      Check FMC deployment readiness for both selected devices.

- name: Submit S2S deployment
  cisco.fmcansible.fmc_configuration:
    operation: createDeploymentRequest
    data:
      type: DeploymentRequest
      version: "0"
      forceDeploy: false
      ignoreWarning: false
      deploymentNote: >-
        {{ s2s_vpn.state | default('present') }} {{ s2s_vpn.name }}
      deviceList: >-
        {{ s2s_deployment_targets | map(attribute='device.id') | list }}
    path_params:
      domainUUID: "{{ s2s_domain_uuid }}"
  register: s2s_deployment_request
  when: s2s_deployment_targets | length > 0

- name: Wait for S2S deployment task
  cisco.fmcansible.fmc_configuration:
    operation: getTaskStatus
    path_params:
      domainUUID: "{{ s2s_domain_uuid }}"
      objectId: "{{ s2s_deployment_request.response.metadata.task.id }}"
    query_params:
      showDetailedDeviceStatus: true
  register: s2s_deployment_status
  until: >-
    s2s_deployment_status.response.status | default('') | upper
    in ['COMPLETED', 'DEPLOYED', 'FAILED']
  retries: 80
  delay: 15
  when: s2s_deployment_targets | length > 0

- name: Require successful S2S deployment
  ansible.builtin.assert:
    that:
      - >-
        s2s_deployment_status.response.status | upper
        in ['COMPLETED', 'DEPLOYED']
      - >-
        s2s_deployment_status.response.subTasks | default([])
        | rejectattr('status', 'equalto', 'SUCCEEDED') | list | length == 0
    fail_msg: >-
      S2S deployment failed: {{ s2s_deployment_status.response.message
      | default('Check FMC deployment details') }}.
  when: s2s_deployment_targets | length > 0
