---
- name: Get endpoints before removing AUTO_VPN
  cisco.fmcansible.fmc_configuration:
    operation: getAllVpnEndpoint
    path_params:
      domainUUID: "{{ sdwan_domain_uuid }}"
      containerUUID: "{{ sdwan_existing_vpn.id }}"
    query_params:
      expanded: true
    register_as: sdwan_endpoints_for_removal
  when: sdwan_vpn_matches | length == 1

- name: Get spoke VTIs before removing AUTO_VPN
  cisco.fmcansible.fmc_configuration:
    operation: getAllFTDVTIInterface
    path_params:
      domainUUID: "{{ sdwan_domain_uuid }}"
      containerUUID: "{{ sdwan_resolved_spoke.device.id }}"
    query_params:
      expanded: true
    register_as: sdwan_spoke_vtis_for_removal
  when:
    - sdwan_vpn_matches | length == 1
    - sdwan_zone_matches | length == 1

- name: Refuse unexpected endpoints before removal
  ansible.builtin.assert:
    that:
      - sdwan_endpoints_for_removal | length <= 2
      - >-
        sdwan_endpoints_for_removal
        | rejectattr('peerType', 'in', ['HUB', 'SPOKE'])
        | list | length == 0
      - >-
        sdwan_endpoints_for_removal
        | rejectattr('device.id', 'in',
                     [sdwan_resolved_hub.device.id,
                      sdwan_resolved_spoke.device.id])
        | list | length == 0
      - >-
        sdwan_endpoints_for_removal
        | selectattr('peerType', 'equalto', 'HUB')
        | list | length <= 1
      - >-
        sdwan_endpoints_for_removal
        | selectattr('peerType', 'equalto', 'SPOKE')
        | list | length <= 1
    fail_msg: >-
      {{ sdwan_vpn.name }} contains an endpoint outside the selected hub
      and spoke. Review the topology before removing it.
  when: sdwan_vpn_matches | length == 1

- name: Select generated spoke SVTI for removal
  ansible.builtin.set_fact:
    sdwan_generated_vtis_for_removal: >-
      {{ (sdwan_spoke_vtis_for_removal | default([]))
         | selectattr('securityZone.id', 'equalto', sdwan_existing_zone.id)
         | selectattr('tunnelSource.id', 'equalto',
                      sdwan_resolved_spoke.source_interface.id)
         | selectattr('tunnelType', 'equalto', 'STATIC') | list }}
  when:
    - sdwan_vpn_matches | length == 1
    - sdwan_zone_matches | length == 1

- name: Refuse ambiguous generated spoke VTIs
  ansible.builtin.assert:
    that:
      - sdwan_generated_vtis_for_removal | length <= 1
    fail_msg: >-
      More than one spoke SVTI uses the owned zone and source interface.
      Review the VTIs on {{ sdwan_vpn.spoke.device }} before deletion.
  when:
    - sdwan_vpn_matches | length == 1
    - sdwan_zone_matches | length == 1

- name: Delete spoke before hub endpoint
  cisco.fmcansible.fmc_configuration:
    operation: deleteVpnEndpoint
    path_params:
      domainUUID: "{{ sdwan_domain_uuid }}"
      containerUUID: "{{ sdwan_existing_vpn.id }}"
      objectId: "{{ sdwan_endpoint_for_removal.id }}"
  loop: >-
    {{ (sdwan_endpoints_for_removal | default([]))
       | sort(attribute='peerType', reverse=true) }}
  loop_control:
    loop_var: sdwan_endpoint_for_removal
    label: >-
      {{ sdwan_endpoint_for_removal.peerType }}
      {{ sdwan_endpoint_for_removal.device.name | default('') }}
  when: sdwan_vpn_matches | length == 1

- name: Verify AUTO_VPN endpoints were removed
  cisco.fmcansible.fmc_configuration:
    operation: getAllVpnEndpoint
    path_params:
      domainUUID: "{{ sdwan_domain_uuid }}"
      containerUUID: "{{ sdwan_existing_vpn.id }}"
    register_as: sdwan_endpoints_after_removal
  when: sdwan_vpn_matches | length == 1

- name: Require no remaining AUTO_VPN endpoints
  ansible.builtin.assert:
    that:
      - sdwan_endpoints_after_removal | length == 0
    fail_msg: >-
      {{ sdwan_vpn.name }} still has endpoints and cannot be safely removed.
  when: sdwan_vpn_matches | length == 1

- name: Delete AUTO_VPN topology
  cisco.fmcansible.fmc_configuration:
    operation: deleteFTDS2SVpnModel
    path_params:
      domainUUID: "{{ sdwan_domain_uuid }}"
      objectId: "{{ sdwan_existing_vpn.id }}"
  when: sdwan_vpn_matches | length == 1

- name: Check whether FMC retained the generated spoke SVTI
  cisco.fmcansible.fmc_configuration:
    operation: getAllFTDVTIInterface
    path_params:
      domainUUID: "{{ sdwan_domain_uuid }}"
      containerUUID: "{{ sdwan_resolved_spoke.device.id }}"
    query_params:
      expanded: true
    register_as: sdwan_spoke_vtis_after_topology_removal
  when:
    - sdwan_vpn_matches | length == 1
    - sdwan_zone_matches | length == 1

- name: Delete retained spoke SVTI from owned zone
  cisco.fmcansible.fmc_configuration:
    operation: deleteFTDVTIInterface
    path_params:
      domainUUID: "{{ sdwan_domain_uuid }}"
      containerUUID: "{{ sdwan_resolved_spoke.device.id }}"
      objectId: "{{ sdwan_retained_spoke_vti.id }}"
  loop: >-
    {{ (sdwan_spoke_vtis_after_topology_removal | default([]))
       | selectattr('id', 'in',
                    sdwan_generated_vtis_for_removal | default([])
                    | map(attribute='id') | list) | list }}
  loop_control:
    loop_var: sdwan_retained_spoke_vti
    label: "{{ sdwan_retained_spoke_vti.ifname | default(sdwan_retained_spoke_vti.id) }}"
  when:
    - sdwan_vpn_matches | length == 1
    - sdwan_zone_matches | length == 1

- name: Delete owned hub DVTI
  cisco.fmcansible.fmc_configuration:
    operation: deleteFTDVTIInterface
    path_params:
      domainUUID: "{{ sdwan_domain_uuid }}"
      containerUUID: "{{ sdwan_resolved_hub.device.id }}"
      objectId: "{{ sdwan_existing_vti.id }}"
  when: sdwan_vti_matches | length == 1

- name: Delete owned hub loopback
  cisco.fmcansible.fmc_configuration:
    operation: deleteFTDLoopbackInterface
    path_params:
      domainUUID: "{{ sdwan_domain_uuid }}"
      containerUUID: "{{ sdwan_resolved_hub.device.id }}"
      objectId: "{{ sdwan_existing_loopback.id }}"
  when: sdwan_loopback_matches | length == 1

- name: Delete owned VTI security zone
  cisco.fmcansible.fmc_configuration:
    operation: deleteSecurityZoneObject
    path_params:
      domainUUID: "{{ sdwan_domain_uuid }}"
      objectId: "{{ sdwan_existing_zone.id }}"
  when: sdwan_zone_matches | length == 1

- name: Delete owned spoke tunnel address pool
  cisco.fmcansible.fmc_configuration:
    operation: deleteIPv4AddressPool
    path_params:
      domainUUID: "{{ sdwan_domain_uuid }}"
      objectId: "{{ sdwan_existing_pool.id }}"
  when: sdwan_pool_matches | length == 1

- name: Read topologies after SD-WAN removal
  cisco.fmcansible.fmc_configuration:
    operation: getAllFTDS2SVpnModel
    path_params:
      domainUUID: "{{ sdwan_domain_uuid }}"
    filters:
      name: "{{ sdwan_vpn.name }}"
    register_as: sdwan_topologies_after_removal

- name: Read spoke tunnel pools after SD-WAN removal
  cisco.fmcansible.fmc_configuration:
    operation: getAllIPv4AddressPool
    path_params:
      domainUUID: "{{ sdwan_domain_uuid }}"
    register_as: sdwan_pools_after_removal

- name: Read security zones after SD-WAN removal
  cisco.fmcansible.fmc_configuration:
    operation: getAllSecurityZoneObject
    path_params:
      domainUUID: "{{ sdwan_domain_uuid }}"
    register_as: sdwan_zones_after_removal

- name: Read hub loopbacks after SD-WAN removal
  cisco.fmcansible.fmc_configuration:
    operation: getAllFTDLoopbackInterface
    path_params:
      domainUUID: "{{ sdwan_domain_uuid }}"
      containerUUID: "{{ sdwan_resolved_hub.device.id }}"
    query_params:
      expanded: true
    register_as: sdwan_loopbacks_after_removal

- name: Read hub VTIs after SD-WAN removal
  cisco.fmcansible.fmc_configuration:
    operation: getAllFTDVTIInterface
    path_params:
      domainUUID: "{{ sdwan_domain_uuid }}"
      containerUUID: "{{ sdwan_resolved_hub.device.id }}"
    query_params:
      expanded: true
    register_as: sdwan_hub_vtis_after_removal

- name: Read spoke VTIs after SD-WAN removal
  cisco.fmcansible.fmc_configuration:
    operation: getAllFTDVTIInterface
    path_params:
      domainUUID: "{{ sdwan_domain_uuid }}"
      containerUUID: "{{ sdwan_resolved_spoke.device.id }}"
    query_params:
      expanded: true
    register_as: sdwan_spoke_vtis_final

- name: Verify AUTO_VPN and pool removal
  ansible.builtin.assert:
    that:
      - >-
        (sdwan_topologies_after_removal | default([]))
        | selectattr('name', 'equalto', sdwan_vpn.name)
        | list | length == 0
      - >-
        (sdwan_pools_after_removal | default([]))
        | selectattr('name', 'equalto', sdwan_vpn.spoke_pool.name)
        | list | length == 0
      - >-
        (sdwan_zones_after_removal | default([]))
        | selectattr('name', 'equalto', sdwan_zone_name)
        | list | length == 0
      - >-
        (sdwan_loopbacks_after_removal | default([]))
        | selectattr('ifname', 'equalto', sdwan_vpn.hub.loopback.ifname)
        | list | length == 0
      - >-
        (sdwan_hub_vtis_after_removal | default([]))
        | selectattr('ifname', 'equalto', sdwan_vpn.hub.tunnel.ifname)
        | list | length == 0
      - >-
        (sdwan_spoke_vtis_final | default([]))
        | selectattr('id', 'in',
                     sdwan_generated_vtis_for_removal | default([])
                     | map(attribute='id') | list)
        | list | length == 0
    fail_msg: >-
      One or more SD-WAN resources for {{ sdwan_vpn.name }} still exist
      after removal. Inspect the topology, pool, zone, hub interfaces,
      and generated spoke SVTI before continuing.
