---
- name: Get deployable devices before S2S changes
  cisco.fmcansible.fmc_configuration:
    operation: getDeployableDevice
    path_params:
      domainUUID: "{{ s2s_domain_uuid }}"
    query_params:
      expanded: true
    register_as: s2s_deployable_before

- name: Display pending deployment targets
  ansible.builtin.debug:
    msg: >-
      {{ (s2s_deployable_before | default([]))
         | map(attribute='device.name') | list }}

- name: Require a clean baseline on the selected FTDs
  ansible.builtin.assert:
    that:
      - >-
        (s2s_deployable_before | default([]))
        | selectattr('device.id', 'in',
                     [s2s_hub_device.id, s2s_spoke_device.id])
        | list | length == 0
    fail_msg: >-
      The hub or spoke has pending changes before this S2S run. Deploy or
      discard those changes separately before setting s2s_vpn.deploy=true.
