---
- name: Validate RAVPN profile {{ ra_input_profile.name | default('unnamed') }}
  ansible.builtin.assert:
    that:
      - ra_input_profile.name | default('') | length > 0
      - ra_input_profile.authentication | default('') in ['ad', 'local']
      - ra_input_profile.realm | default('') | length > 0
      - ra_input_profile.alias | default(ra_input_profile.name) | length > 0
    fail_msg: >-
      Each ravpn.profiles item needs name, authentication=ad|local, realm,
      and optionally alias.

- name: Validate AD authorization for profile {{ ra_input_profile.name }}
  ansible.builtin.assert:
    that:
      - ra_input_profile.authorization | default({}) is mapping
      - ra_input_profile.authorization.ldap_attribute | default('memberOf') is string
      - ra_input_profile.authorization.ldap_attribute | default('memberOf') | trim | length > 0
      - ra_input_profile.authorization.ldap_value | default('') is string
      - ra_input_profile.authorization.ldap_value | default('') | trim | length > 0
    fail_msg: >-
      AD profile {{ ra_input_profile.name }} needs authorization.ldap_value
      and optionally authorization.ldap_attribute (default memberOf).
  when: ra_input_profile.authentication == 'ad'

- name: Select realm for profile {{ ra_input_profile.name }}
  ansible.builtin.set_fact:
    ra_realm_matches: >-
      {{ ra_realms
         | selectattr('name', 'equalto', ra_input_profile.realm) | list }}

- name: Require one identity realm for profile {{ ra_input_profile.name }}
  ansible.builtin.assert:
    that:
      - ra_realm_matches | length == 1
    fail_msg: >-
      Profile {{ ra_input_profile.name }} needs exactly one existing realm
      named {{ ra_input_profile.realm }}.

- name: Read realm for profile {{ ra_input_profile.name }}
  cisco.fmcansible.fmc_configuration:
    operation: getRealm
    path_params:
      domainUUID: "{{ ra_domain_uuid }}"
      objectId: "{{ ra_realm_matches[0].id }}"
    register_as: ra_realm
  no_log: true

- name: Require matching realm type for profile {{ ra_input_profile.name }}
  ansible.builtin.assert:
    that:
      - ra_realm.realmType == ('AD' if ra_input_profile.authentication == 'ad' else 'LOCAL')
    fail_msg: >-
      Profile {{ ra_input_profile.name }} needs a
      {{ 'AD' if ra_input_profile.authentication == 'ad' else 'LOCAL' }}
      realm named {{ ra_input_profile.realm }}.

- name: Store resolved profile {{ ra_input_profile.name }}
  ansible.builtin.set_fact:
    ra_resolved_profiles: >-
      {{ ra_resolved_profiles + [{
           'name': ravpn.name ~ '-' ~ ra_input_profile.name,
           'alias': ra_input_profile.alias | default(ra_input_profile.name),
           'authentication': ra_input_profile.authentication,
           'realm': {
             'name': ra_realm.name,
             'id': ra_realm.id,
             'type': ra_realm.type}
         } | combine(
           {'authorization': {
              'ldap_attribute': ra_input_profile.authorization.ldap_attribute
                | default('memberOf') | trim,
              'ldap_value': ra_input_profile.authorization.ldap_value | trim}}
           if ra_input_profile.authentication == 'ad' else {}
         )] }}
