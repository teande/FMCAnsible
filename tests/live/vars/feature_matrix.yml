fmcansible_platform_matrix:
  onprem:
    required_groups:
      - common
      - access_policy_advanced
      - platform_settings
    optional_groups:
      - vpn
      - routing
      - legacy_platform_settings
    ravpn_create_delete: true
    ravpn_parent_local_realm_binding: false
    ravpn_local_auth_deployment: false
    ravpn_device_certificate_enrollment: true
    ravpn_ldap_attribute_map: true
    s2s_create_delete: true
    policy_s2s_create_delete: true
    route_based_s2s_create_delete: false
  cdfmc:
    required_groups:
      - common
      - access_policy_advanced
      - platform_settings
    optional_groups:
      - vpn
      - routing
      - cloud_access_policy_advanced
    ravpn_create_delete: false
    ravpn_parent_local_realm_binding: false
    ravpn_local_auth_deployment: false
    ravpn_device_certificate_enrollment: false
    ravpn_ldap_attribute_map: false
    s2s_create_delete: true
    policy_s2s_create_delete: true
    route_based_s2s_create_delete: false
