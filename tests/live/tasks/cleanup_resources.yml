---
- name: Get FMC domains for cleanup
  cisco.fmcansible.fmc_configuration:
    operation: getAllDomain
    register_as: cleanup_domains

- name: Store cleanup domain UUID
  ansible.builtin.set_fact:
    fmcansible_domain_uuid: >-
      {{ cleanup_domains[fmcansible_domain_index].uuid }}

- name: Get access policies for cleanup
  cisco.fmcansible.fmc_configuration:
    operation: getAllAccessPolicy
    path_params:
      domainUUID: "{{ fmcansible_domain_uuid }}"
    register_as: cleanup_access_policies

- name: Select stale access policies
  ansible.builtin.set_fact:
    fmcansible_stale_access_policies: >-
      {{ (cleanup_access_policies | default([]))
         | selectattr('name', 'defined')
         | selectattr('name', 'match', '^' ~ fmcansible_cleanup_prefix)
         | list }}

- name: Delete stale access policies and their rules
  ansible.builtin.include_tasks: cleanup_access_policy.yml
  loop: "{{ fmcansible_stale_access_policies }}"
  loop_control:
    loop_var: stale_access_policy
    label: "{{ stale_access_policy.name }}"

- name: Get FTD Platform Settings policies for cleanup
  cisco.fmcansible.fmc_configuration:
    operation: getAllFTDPlatformSettingsPolicy
    path_params:
      domainUUID: "{{ fmcansible_domain_uuid }}"
    register_as: cleanup_platform_policies

- name: Select stale FTD Platform Settings policies
  ansible.builtin.set_fact:
    fmcansible_stale_platform_policies: >-
      {{ (cleanup_platform_policies | default([]))
         | selectattr('name', 'defined')
         | selectattr('name', 'match', '^' ~ fmcansible_cleanup_prefix)
         | list }}

- name: Delete stale FTD Platform Settings policies
  cisco.fmcansible.fmc_configuration:
    operation: deleteFTDPlatformSettingsPolicy
    path_params:
      domainUUID: "{{ fmcansible_domain_uuid }}"
      objectId: "{{ stale_platform_policy.id }}"
  loop: "{{ fmcansible_stale_platform_policies }}"
  loop_control:
    loop_var: stale_platform_policy
    label: "{{ stale_platform_policy.name }}"

