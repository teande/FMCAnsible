    fmcansible_remaining_s2s_vpns: >-
      {{ (cleanup_s2s_vpns_after | default([]))
         | selectattr('name', 'defined')
         | selectattr('name', 'match', '^' ~ fmcansible_cleanup_prefix)
         | list }}
    fmcansible_remaining_ra_vpns: >-
      {{ (cleanup_ra_vpns_after | default([]))
         | selectattr('name', 'defined')
         | selectattr('name', 'match', '^' ~ fmcansible_cleanup_prefix)
         | list }}
    fmcansible_remaining_group_policies: >-
      {{ (cleanup_group_policies_after | default([]))
         | selectattr('name', 'defined')
         | selectattr('name', 'match', '^' ~ fmcansible_cleanup_prefix)
         | list }}
    fmcansible_remaining_ipv4_pools: >-
      {{ (cleanup_ipv4_pools_after | default([]))
         | selectattr('name', 'defined')
         | selectattr('name', 'match', '^' ~ fmcansible_cleanup_prefix)
         | list }}
    fmcansible_remaining_dap_policies: >-
      {{ (cleanup_dap_policies_after | default([]))
         | selectattr('name', 'defined')
         | selectattr('name', 'match', '^' ~ fmcansible_cleanup_prefix)
         | list }}
    fmcansible_remaining_certificates: >-
      {{ (cleanup_certificates_after | default([]))
         | selectattr('name', 'defined')
         | selectattr('name', 'match', '^' ~ fmcansible_cleanup_prefix)
         | list }}
    fmcansible_remaining_security_zones: >-
      {{ (cleanup_security_zones_after | default([]))
         | selectattr('name', 'defined')
         | selectattr('name', 'match', '^' ~ fmcansible_cleanup_prefix)
         | list }}
    fmcansible_remaining_network_groups: >-
      {{ (cleanup_network_groups_after | default([]))
         | selectattr('name', 'defined')
         | selectattr('name', 'match', '^' ~ fmcansible_cleanup_prefix)
         | list }}

- name: Verify live-test resources were removed
  ansible.builtin.assert:
    that:
      - fmcansible_remaining_hosts | length == 0
      - fmcansible_remaining_networks | length == 0
      - fmcansible_remaining_access_policies | length == 0
      - fmcansible_remaining_platform_policies | length == 0
      - fmcansible_remaining_file_policies | length == 0
      - fmcansible_remaining_s2s_vpns | length == 0
      - fmcansible_remaining_ra_vpns | length == 0
      - fmcansible_remaining_group_policies | length == 0
      - fmcansible_remaining_ipv4_pools | length == 0
      - fmcansible_remaining_dap_policies | length == 0
      - fmcansible_remaining_certificates | length == 0
      - fmcansible_remaining_security_zones | length == 0
      - fmcansible_remaining_network_groups | length == 0
    fail_msg: >-
      Cleanup left prefixed resources behind. Run 99_cleanup.yml after fixing
      the first reported delete failure; do not start another live test.
    success_msg: "No prefixed FMCAnsible live-test resources remain."
