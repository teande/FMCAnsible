- name: Re-read resources after cleanup
  block:
    - name: Re-read host objects
      cisco.fmcansible.fmc_configuration:
        operation: getAllHostObject
        path_params:
          domainUUID: "{{ fmcansible_domain_uuid }}"
        register_as: cleanup_hosts_after

    - name: Re-read network objects
      cisco.fmcansible.fmc_configuration:
        operation: getAllNetworkObject
        path_params:
          domainUUID: "{{ fmcansible_domain_uuid }}"
        register_as: cleanup_networks_after

    - name: Re-read access policies
      cisco.fmcansible.fmc_configuration:
        operation: getAllAccessPolicy
        path_params:
          domainUUID: "{{ fmcansible_domain_uuid }}"
        register_as: cleanup_access_policies_after

    - name: Re-read FTD Platform Settings policies
      cisco.fmcansible.fmc_configuration:
        operation: getAllFTDPlatformSettingsPolicy
        path_params:
          domainUUID: "{{ fmcansible_domain_uuid }}"
        register_as: cleanup_platform_policies_after

    - name: Re-read file policies
      cisco.fmcansible.fmc_configuration:
        operation: getAllFilePolicy
        path_params:
          domainUUID: "{{ fmcansible_domain_uuid }}"
        register_as: cleanup_file_policies_after

    - name: Re-read site-to-site VPNs
      cisco.fmcansible.fmc_configuration:
        operation: getAllFTDS2SVpnModel
        path_params:
          domainUUID: "{{ fmcansible_domain_uuid }}"
        register_as: cleanup_s2s_vpns_after
      when: >-
        fmcansible_platform_matrix[fmcansible_target]
        .s2s_create_delete | bool

    - name: Re-read RA VPNs
      cisco.fmcansible.fmc_configuration:
        operation: getAllFTDRAVpnModel
        path_params:
          domainUUID: "{{ fmcansible_domain_uuid }}"
        register_as: cleanup_ra_vpns_after
      when: >-
        fmcansible_platform_matrix[fmcansible_target]
        .ravpn_create_delete | bool

    - name: Re-read group policies
      cisco.fmcansible.fmc_configuration:
        operation: getAllGroupPolicyModel
        path_params:
          domainUUID: "{{ fmcansible_domain_uuid }}"
        register_as: cleanup_group_policies_after
      when: >-
        fmcansible_platform_matrix[fmcansible_target]
        .ravpn_create_delete | bool

    - name: Re-read IPv4 address pools
      cisco.fmcansible.fmc_configuration:
        operation: getAllIPv4AddressPool
        path_params:
          domainUUID: "{{ fmcansible_domain_uuid }}"
        register_as: cleanup_ipv4_pools_after
      when: >-
        fmcansible_platform_matrix[fmcansible_target]
        .ravpn_create_delete | bool

    - name: Re-read dynamic access policies
      cisco.fmcansible.fmc_configuration:
        operation: getAllDynamicAccessPolicy
        path_params:
          domainUUID: "{{ fmcansible_domain_uuid }}"
        register_as: cleanup_dap_policies_after
      when: >-
        fmcansible_platform_matrix[fmcansible_target]
        .ravpn_create_delete | bool

    - name: Re-read certificate enrollments
      cisco.fmcansible.fmc_configuration:
        operation: getAllVpnCertEnrollmentModel
        path_params:
          domainUUID: "{{ fmcansible_domain_uuid }}"
        register_as: cleanup_certificates_after
      when: >-
        fmcansible_platform_matrix[fmcansible_target]
        .ravpn_create_delete | bool

    - name: Re-read security zones
      cisco.fmcansible.fmc_configuration:
