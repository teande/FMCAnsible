        path_params:
          domainUUID: "{{ fmcansible_domain_uuid }}"
        register_as: cleanup_security_zones_after

    - name: Re-read network groups
      cisco.fmcansible.fmc_configuration:
        operation: getAllNetworkGroup
        path_params:
          domainUUID: "{{ fmcansible_domain_uuid }}"
        register_as: cleanup_network_groups_after

- name: Select resources remaining after cleanup
  ansible.builtin.set_fact:
    fmcansible_remaining_hosts: >-
      {{ (cleanup_hosts_after | default([]))
         | selectattr('name', 'defined')
         | selectattr('name', 'match', '^' ~ fmcansible_cleanup_prefix)
         | list }}
    fmcansible_remaining_networks: >-
      {{ (cleanup_networks_after | default([]))
         | selectattr('name', 'defined')
         | selectattr('name', 'match', '^' ~ fmcansible_cleanup_prefix)
         | list }}
    fmcansible_remaining_access_policies: >-
      {{ (cleanup_access_policies_after | default([]))
         | selectattr('name', 'defined')
         | selectattr('name', 'match', '^' ~ fmcansible_cleanup_prefix)
         | list }}
    fmcansible_remaining_platform_policies: >-
